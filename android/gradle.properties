# Bellek kısıtlı ortam için ayarlar (4 çekirdek / düşük RAM).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.workers.max=2
org.gradle.configureondemand=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

# Chaquopy için derleme Python'u (yerel makinede 3.14 olduğundan 3.11'e işaret edilir).
# Derlerken: -PbuildPython=/yol/python3  veya AWU_BUILD_PYTHON ortam değişkeni.
